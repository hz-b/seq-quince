[build-system]
requires = [
  "setuptools>=61",
  "wheel",
  "setuptools_scm[toml]>=7"
]
build-backend = "setuptools.build_meta"

[project]
name = "seq-quince"
dynamic = ["version"]
description = "An asynchronous, YAML-configured device scheduler for EPICS beamlines, built on kiwi-scan."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Andreas Balzer" },
]
keywords = [
  "epics",
  "scientific",
  "instrumentation",
  "beamline",
  "control-system",
  "scheduler",
  "sequence",
  "automation",
  "yaml",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "kiwi-scan>=0.6.1",
  "PyYAML>=6.0",
  "jinja2",
  "pyepics>=3.5",
  "ophyd",
]

[project.optional-dependencies]
dev = [ "pytest", "pytest-cov", "pyright", "caproto[complete]", "pylint", "ruff", "bandit" ]

[project.urls]
Homepage = "https://github.com/hz-b/seq-quince"
Repository = "https://github.com/hz-b/seq-quince"
Issues = "https://github.com/hz-b/seq-quince/issues"

[project.scripts]
scheduler_runner = "seq_quince.scheduler_runner:run"
device_runner = "seq_quince.device_runner:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# namespace packages.
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "FA100",  # Do not require future annotations for typing simplification
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint.messages_control]
disable = [
    "all",
]

enable = [
    ## Serious correctness problems
    "E",
    "F",

    ## API/inheritance problems
    "arguments-differ",

    ## Enable for maintainablility checks by cathegory
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "duplicate-code",

    ## Keep suppressions clean
    "useless-suppression",
]

[tool.pyright]
include = ["src/seq_quince"]
extraPaths = ["src"]
pythonVersion = "3.8"
pythonPlatform = "Linux"
typeCheckingMode = "basic"


[tool.setuptools_scm]
tag_regex = "^v?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:\\+[A-Za-z0-9\\.]+)?)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"
